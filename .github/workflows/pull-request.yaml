name: pull-request

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: format
            command: uv run ruff format --check .
          - check: lint
            command: uv run ruff check .
          - check: build
            command: uv build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run check
        run: ${{ matrix.command }}
